<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Page introuvable — Fabrice Greiner</title>
<style>
:root{--bg:#0b1119;--txt:#e6edf5;--muted:#93a4bb;--accent:#38bdf8;--line:#1f2c3f}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font:400 17px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}
b{display:block;font-size:64px;letter-spacing:-.04em;color:var(--accent);margin-bottom:12px}
h1{font-size:24px;letter-spacing:-.02em;margin-bottom:10px}
p{color:var(--muted);margin-bottom:28px}
a{display:inline-block;border:1px solid var(--line);border-radius:10px;padding:12px 22px;
color:var(--txt);text-decoration:none;font-weight:600;font-size:15px;transition:.2s}
a:hover{border-color:var(--accent);color:var(--accent)}
</style>
</head>
<body>
<div>
  <b>404</b>
  <h1>Cette page n'existe pas</h1>
  <p>Le lien est peut-être obsolète ou mal saisi.</p>
  <a href="/">Retour à l'accueil</a>
</div>
</body>
</html>
